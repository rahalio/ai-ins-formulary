apis:
  identity:
    root: src/identity.yaml
  candidates:
    root: src/candidates.yaml
  readiness:
    root: src/readiness.yaml
  gates:
    root: src/gates.yaml
  investment:
    root: src/investment.yaml
  registry:
    root: src/registry.yaml
  benefits:
    root: src/benefits.yaml
  portfolio:
    root: src/portfolio.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
