openapi: 3.1.0
info:
  title: Formulary Benefits API
  version: 0.1.0
  description: Benefit claims and finance-confirmed closes.
  x-domain: ben
  x-product-slug: ai-ins-formulary
servers:
  - url: https://api.formulary.local
security:
  - bearerAuth: []
tags:
  - name: Benefits
    description: Benefit claims and finance-confirmed closes
paths:
  /v1/benefits/claims:
    post:
      operationId: claimBenefit
      tags: [Benefits]
      summary: Claim benefit in insurance financial terms
      x-repository: BenefitClaim
      x-dynamodb:
        entityType: "BENEFIT_CLAIM"
        pkPatternTemplate: "CANDIDATE#${candidateId}"
        skPatternTemplate: "BENEFIT#${id}"
        pkPattern: "entity"
        usePkQuery: true
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./benefits.schemas.yaml#/components/schemas/BenefitClaimCreate
      responses:
        "201":
          description: Benefit claimed in loss-ratio, expense-ratio, or revenue terms
          content:
            application/json:
              schema:
                $ref: ./benefits.schemas.yaml#/components/schemas/BenefitClaimResponse
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/benefits/claims/{claimId}/close:
    parameters:
      - $ref: ./benefits.schemas.yaml#/components/parameters/ClaimId
    post:
      operationId: closeBenefitWithFinance
      tags: [Benefits]
      summary: Close benefit with finance confirmation
      x-repository: BenefitClaim
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./benefits.schemas.yaml#/components/schemas/BenefitCloseCreate
      responses:
        "200":
          description: Finance confirmation or denial of the claimed movement
          content:
            application/json:
              schema:
                $ref: ./benefits.schemas.yaml#/components/schemas/BenefitCloseResponse
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        "404":
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
