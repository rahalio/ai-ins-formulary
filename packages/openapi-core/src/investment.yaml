openapi: 3.1.0
info:
  title: Formulary Investment API
  version: 0.1.0
  description: First-release sizing, kill criteria, and funding decisions.
  x-domain: inv
  x-product-slug: ai-ins-formulary
servers:
  - url: https://api.formulary.local
security:
  - bearerAuth: []
tags:
  - name: Investment
    description: First-release sizing, kill criteria, and funding decisions
paths:
  /v1/candidates/{candidateId}/investment:
    parameters:
      - $ref: ./common/formulary-primitives.yaml#/components/parameters/CandidateId
    post:
      operationId: approveInvestment
      tags: [Investment]
      summary: Approve investment with kill criteria
      x-repository: InvestmentDecision
      x-dynamodb:
        entityType: "INVESTMENT"
        pkPatternTemplate: "CANDIDATE#${candidateId}"
        skPatternTemplate: "INVESTMENT#${id}"
        pkPattern: "entity"
        usePkQuery: true
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./investment.schemas.yaml#/components/schemas/InvestmentDecisionCreate
      responses:
        "201":
          description: Investment approved with first-release scope and kill criteria
          content:
            application/json:
              schema:
                $ref: ./investment.schemas.yaml#/components/schemas/InvestmentDecisionResponse
        "409":
          $ref: ./common/responses.yaml#/components/responses/Conflict
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v1/candidates/{candidateId}/kill-review:
    parameters:
      - $ref: ./common/formulary-primitives.yaml#/components/parameters/CandidateId
    post:
      operationId: reviewKillCriteria
      tags: [Investment]
      summary: Review kill criteria at agreed decision date
      x-repository: InvestmentDecision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./investment.schemas.yaml#/components/schemas/KillReviewRequest
      responses:
        "200":
          description: Kill decision at the agreed decision date
          content:
            application/json:
              schema:
                $ref: ./candidates.schemas.yaml#/components/schemas/UseCaseCandidateResponse
        "422":
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        "401":
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
